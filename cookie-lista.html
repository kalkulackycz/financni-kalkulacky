<!--
  COOKIE LIŠTA – Finanční Mapa
  ============================
  Tento kód vlož na KAŽDOU stránku webu, těsně před tag </body>.

  DŮLEŽITÉ: Svůj Google Analytics kód (gtag.js) NEVKLÁDEJ do <head> jako doteď.
  Místo toho ho vlož do funkce loadAnalytics() níže (viz komentář uvnitř).
  Tím se Analytics spustí až poté, co uživatel klikne "Přijmout".
-->

<div id="cookie-banner" style="
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#ffffff;
  box-shadow:0 -2px 12px rgba(0,0,0,0.12);
  padding:20px;
  z-index:9999;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
">
  <div style="max-width:900px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px;">
    <p style="margin:0; color:#444; font-size:14px; flex:1; min-width:250px; line-height:1.5;">
      Tento web používá cookies pro měření návštěvnosti (Google Analytics) a
      zobrazení reklam. Kliknutím na „Přijmout vše" souhlasíte s jejich
      použitím. Více v
      <a href="zasady-ochrany-osobnich-udaju.html" style="color:#6c5ce7;">zásadách ochrany osobních údajů</a>.
    </p>
    <div style="display:flex; gap:10px; flex-shrink:0;">
      <button onclick="cookieConsent(false)" style="
        background:#f0f0f5;
        color:#2d2d3a;
        border:none;
        padding:10px 18px;
        border-radius:8px;
        font-size:14px;
        font-weight:600;
        cursor:pointer;
      ">Odmítnout</button>
      <button onclick="cookieConsent(true)" style="
        background:#16a34a;
        color:white;
        border:none;
        padding:10px 18px;
        border-radius:8px;
        font-size:14px;
        font-weight:600;
        cursor:pointer;
      ">Přijmout vše</button>
    </div>
  </div>
</div>

<script>
(function() {
  // Zobrazit lištu, pokud ještě uživatel nerozhodl
  if (!localStorage.getItem('cookie_consent')) {
    document.getElementById('cookie-banner').style.display = 'block';
  } else if (localStorage.getItem('cookie_consent') === 'accepted') {
    loadAnalytics();
  }
})();

function cookieConsent(accepted) {
  localStorage.setItem('cookie_consent', accepted ? 'accepted' : 'rejected');
  document.getElementById('cookie-banner').style.display = 'none';
  if (accepted) {
    loadAnalytics();
  }
}

function loadAnalytics() {

}
</script>
