<div class="uvodni-sekce">

<h1>Kontakt</h1>

<p class="uvod">
Máte dotaz, připomínku nebo jste našli chybu ve výpočtu?
Napište nám.
</p>


<form action="https://api.web3forms.com/submit" method="POST" class="kontakt-formular">

    <input type="hidden" name="access_key" value="ec684d6d-92bb-4ea6-a43a-9a6483458ddd">
    
    <input type="hidden" name="redirect" value="https://financnimapa.cz/odeslano.html">

    <input type="hidden" name="subject" value="Nová zpráva z Finanční Mapy">

    <input type="hidden" name="from_name" value="Finanční Mapa">

    <input type="checkbox" name="botcheck" class="hidden" style="display:none;">


    <div class="formular-skupina">
        <label for="name">Jméno</label>
        <input 
        type="text"
        id="name"
        name="name"
        placeholder="Vaše jméno"
        required>
    </div>


    <div class="formular-skupina">
        <label for="email">E-mail</label>
        <input
        type="email"
        id="email"
        name="email"
        placeholder="vas@email.cz"
        required>
    </div>


    <div class="formular-skupina">
        <label for="message">Zpráva</label>
        <textarea
        id="message"
        name="message"
        rows="6"
        placeholder="Napište nám zprávu..."
        required></textarea>
    </div>


    <div class="formular-upozorneni">
        ⚠️ Do formuláře prosím nezadávejte citlivé osobní ani finanční údaje.
    </div>


    <button type="submit" class="formular-tlacitko">
        Odeslat zprávu
    </button>


</form>


</div>


<footer id="paticka" class="paticka"></footer>


<script src="js/paticka.js"></script>

</body>
