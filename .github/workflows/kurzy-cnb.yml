name: Aktualizace kurzů ČNB

on:
  schedule:
    # každý den 12:40 UTC = 14:40 SEČ (ČNB zveřejňuje kurz ~14:30)
    - cron: "40 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stažení a uložení kurzovního lístku ČNB
        run: node scripts/aktualizuj-kurzy.mjs

      - name: Commit změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kurzy.json
          git diff --cached --quiet || git commit -m "Aktualizace kurzů ČNB (automat)"
          git push
